<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hex Meet Participants</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1b1b1f;
        --muted: #6b6b76;
        --line: #d9d9e0;
        --ok: #15803d;
        --bad: #b91c1c;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #ececf1;
          --muted: #9b9ba6;
          --line: #3a3a44;
          --ok: #4ade80;
          --bad: #f87171;
          --accent: #60a5fa;
        }
      }
      body {
        margin: 0;
        padding: 14px;
        width: 320px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      p.help {
        margin: 0 0 12px;
        color: var(--muted);
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-weight: 600;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
      }
      row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      textarea {
        width: 100%;
        margin-top: 8px;
        box-sizing: border-box;
        font: 11px/1.35 ui-monospace, monospace;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      summary {
        margin-top: 12px;
        color: var(--muted);
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        white-space: pre-wrap;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <h1>Hex Meet Participants</h1>
    <p class="help">Names who speaks in Google Meet. Pair with Hex fills the connection automatically.</p>

    <details id="manual" open>
      <summary>Manual setup</summary>
      <label for="endpoint">Endpoint</label>
      <input id="endpoint" type="text" placeholder="http://127.0.0.1:52341" spellcheck="false" />

      <label for="token">Token</label>
      <input id="token" type="password" placeholder="hex_…" spellcheck="false" />
    </details>

    <label for="meetName">Your name in Hex (optional)</label>
    <input id="meetName" type="text" placeholder="e.g. John" spellcheck="false" />
    <p class="help" style="margin: 4px 0 0">
      Labels your microphone turns. It never decides who a remote speaker is.
    </p>

    <row>
      <input id="enabled" type="checkbox" />
      <label for="enabled" style="margin: 0; font-weight: 500">Report speakers to Hex</label>
    </row>

    <row>
      <button id="save" class="primary">Save</button>
      <button id="pair">Pair with Hex</button>
    </row>

    <row>
      <button id="test">Test connection</button>
      <button id="probe">Copy DOM probe</button>
    </row>
    <textarea id="probeOut" readonly hidden spellcheck="false"></textarea>

    <div id="status">Not configured.</div>

    <script src="popup.js"></script>
  </body>
</html>
